name: Clone External Repository and Use It

on:
    schedule:
      - cron: "0 17,23 * * *"
    workflow_dispatch:

jobs:
  clone-and-use:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4 # Update juga action checkout ke v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Menambahkan parameter ini seringkali membantu meredam masalah resolusi modul global
          cache: 'npm'

      - name: Initialize & Install dependencies in external repository
        run: |
          cd external-repo
          npm init -y
          npm install
          # Hapus tsx lama yang bermasalah dan pasang versi terbaru
          npm uninstall tsx
          npm install tsx@latest --save-dev

      - name: Download chlist.txt file
        run: |
          cd external-repo
          curl -o chlist.txt https://raw.githubusercontent.com/kemalsyabaniadama/test-epg/refs/heads/main/.github/workflows/chlist.txt

      - name: Run script with clean npx cache
        run: |
          cd external-repo
          # Membersihkan npx cache agar tidak mengambil versi tsx lama yang korup
          npx --clear-npx-cache tsx scripts/commands/epg/grab.ts --channels=chlist.txt

      - name: Copy EPG file to main repository
        run: |
          cp external-repo/guide.xml .

      - name: Commit and Push EPG file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add guide.xml
          git commit -m "Upload generated guide.xml"
          git push
